name: Deploy Frontend - Development

on:
  workflow_run:
    workflows: ["Deploy Backend - Development"]
    types: [completed]
    branches: [dev]
  workflow_dispatch:  # for manual testing

jobs:
  deploy-frontend-dev:
    runs-on: ubuntu-latest
    # Only run if triggered by manual dispatch or successful workflow completion
    if: >
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    
    permissions:
      id-token: write   # This is required for requesting the JWT
      contents: read    # This is required for actions/checkout
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for path checking

      - name: Check for frontend changes
        id: check-changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # For workflow_run triggers, check if there are frontend changes in the last commit
            echo "Checking for frontend changes in workflow_run trigger..."
            
            # Get the commit SHA from the triggering workflow
            TRIGGER_SHA="${{ github.event.workflow_run.head_sha }}"
            echo "Trigger SHA: $TRIGGER_SHA"
            
            # Check if there are changes in frontend/ directory
            FRONTEND_CHANGES=$(git diff --name-only $TRIGGER_SHA~1 $TRIGGER_SHA | grep -E '^frontend/' || true)
            
            if [ -n "$FRONTEND_CHANGES" ]; then
              echo "Frontend changes detected:"
              echo "$FRONTEND_CHANGES"
              echo "should-deploy=true" >> $GITHUB_OUTPUT
            else
              echo "No frontend changes detected, skipping deployment"
              echo "should-deploy=false" >> $GITHUB_OUTPUT
            fi
          else
            # For workflow_dispatch, always deploy
            echo "Manual trigger, proceeding with deployment"
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.check-changes.outputs.should-deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Debug AWS Account ID
        if: steps.check-changes.outputs.should-deploy == 'true'
        run: |
          echo "AWS Account ID: ${{ vars.AWS_ACCOUNT_ID_DEV }}"
          echo "Expected ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_DEV }}:role/github-actions-dev"

      - name: Configure AWS credentials
        if: steps.check-changes.outputs.should-deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_DEV }}:role/github-actions-dev
          role-session-name: github-actions-dev-frontend
          aws-region: us-east-1

      - name: Install frontend dependencies
        if: steps.check-changes.outputs.should-deploy == 'true'
        working-directory: ./frontend
        run: |
          npm install

      - name: Build frontend
        if: steps.check-changes.outputs.should-deploy == 'true'
        working-directory: ./frontend
        run: |
          npm run build

      - name: Deploy frontend to S3
        if: steps.check-changes.outputs.should-deploy == 'true'
        working-directory: ./frontend
        run: |
          aws s3 sync ./build s3://choregarden-frontend-dev --delete

      - name: Update frontend config
        if: steps.check-changes.outputs.should-deploy == 'true'
        uses: ./.github/actions/update-frontend-config
        with:
          environment: 'dev'
          s3-bucket: 'choregarden-frontend-dev'

      - name: Deployment summary
        if: steps.check-changes.outputs.should-deploy == 'true'
        run: |
          echo "Frontend deployment completed successfully."
          echo "Trigger: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "Triggered by backend deployment completion"
          else
            echo "Manual deployment triggered"
          fi
